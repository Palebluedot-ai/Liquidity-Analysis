[project]
name = "liquidity-analysis"
version = "0.2.0"
description = "Lark Bot for Multi-Exchange Order Book Slippage & OTC Block Trade Analysis"
requires-python = ">=3.10"
dependencies = [
    "lark-oapi>=1.7.3,<2.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["liquidity_analysis"]
